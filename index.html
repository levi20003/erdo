<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a6b43" />
    <script>
      // Light or dark before the first paint (same rule as src/components/ThemeRoot.jsx).
      try {
        var pref = (JSON.parse(localStorage.getItem('focusgrove:v1') || '{}').prefs || {}).theme
        var dark = pref === 'dark' || (pref !== 'light' && !(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches))
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (!dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#40a064')
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <meta name="description" content="FocusGrove — offline fókusz időzítő: minden befejezett kör egy növény az erdődben." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FocusGrove" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>FocusGrove</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
